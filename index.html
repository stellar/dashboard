<!DOCTYPE html>
<html>
  <head>
    <title>Stellar Network Dashboard</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      description="Live metrics about the Stellar public network, testnet, and lumen supply numbers."
    />

    <!-- social media tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@StellarOrg" />
    <meta name="twitter:title" content="Stellar Network Dashboard" />
    <meta
      name="twitter:description"
      content="Live metrics about the Stellar public network, testnet, and lumen supply numbers."
    />
    <meta name="twitter:creator" content="@StellarOrg" />
    <meta
      name="twitter:image:src"
      content="https://dashboard.stellar.org/og.png"
    />
    <meta property="og:title" content="Stellar Network Dashboard" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dashboard.stellar.org" />
    <meta property="og:image" content="https://dashboard.stellar.org/og.png" />
    <meta
      property="og:description"
      content="Live metrics about the Stellar public network, testnet, and lumen supply numbers."
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/frontend/assets/favicon.svg"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#0f0f0f" />

    <!-- Set theme before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        var stored;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {
          stored = null;
        }
        var theme =
          stored ||
          (window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" src="/frontend/main.jsx"></script>

    <script>
      (function (i, s, o, g, r, a, m) {
        i["GoogleAnalyticsObject"] = r;
        (i[r] =
          i[r] ||
          function () {
            (i[r].q = i[r].q || []).push(arguments);
          }),
          (i[r].l = 1 * new Date());
        (a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]);
        a.async = 1;
        a.src = g;
        m.parentNode.insertBefore(a, m);
      })(
        window,
        document,
        "script",
        "https://www.google-analytics.com/analytics.js",
        "ga",
      );

      ga("create", "UA-53373928-3", "auto");
      ga("send", "pageview");
    </script>
  </body>
</html>
